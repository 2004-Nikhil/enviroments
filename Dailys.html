<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Coding Daily's</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily coding practice resources and challenges for aspiring developers." />
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" type="image/png" />
    <style>
      :root {
        --bg-primary: #15171a;
        --bg-secondary: #1a1c1f;
        --bg-card: #1c1e22;
        --text-primary: #e7e5e0;
        --text-secondary: #9a9a94;
        --text-muted: #6b6c68;
        --accent: #7fa89a;
        --accent-hover: #9bbfb2;
        --border: #2a2c2f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        font-size: 15px;
      }

      /* Only animate what needs to change on theme toggle, not the whole DOM */
      body, .header, .resource-chip, .theme-toggle {
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }

      /* Header */
      .header {
        position: sticky;
        top: 0;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 1.5rem 0;
        z-index: 100;
      }
      .header-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }
      .theme-toggle {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .theme-toggle:hover,
      .theme-toggle:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
      }
      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Main content */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }
      .intro {
        text-align: center;
        margin-bottom: 4rem;
      }
      .intro h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: var(--text-primary);
        letter-spacing: -0.03em;
      }
      .intro p {
        font-size: 1.125rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
      }

      /* Resource grid — compact wrapped chips, no descriptions */
      .resource-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .resource-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.85rem 1.35rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        text-decoration: none;
        color: var(--text-primary);
        font-size: 0.9375rem;
        font-weight: 500;
      }
      .resource-tag {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      .resource-chip:hover,
      .resource-chip:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
      }
      .resource-chip:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Footer */
      .footer {
        border-top: 1px solid var(--border);
        padding: 2rem 0;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header-content {
          padding: 0 1rem;
        }
        .container {
          padding: 2rem 1rem;
        }
        .intro h1 {
          font-size: 2rem;
        }
        .resource-grid {
          gap: 0.6rem;
        }
        .resource-chip {
          padding: 0.7rem 1.1rem;
          font-size: 0.875rem;
        }
      }

      /* Light theme variables (kept, muted and calm to match) */
      [data-theme="light"] {
        --bg-primary: #f7f6f3;
        --bg-secondary: #efeee9;
        --bg-card: #ffffff;
        --text-primary: #1e1f1c;
        --text-secondary: #63645e;
        --text-muted: #93938c;
        --accent: #4f8271;
        --accent-hover: #3d6a5c;
        --border: #e2e0d8;
      }

      /* Respect reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <div class="logo">Coding Daily's</div>
        <button class="theme-toggle" onclick="toggleTheme()">
          <span id="theme-text">Light Mode</span>
        </button>
      </div>
    </header>
    <main class="container">
      <div class="intro">
        <h1>Daily Coding Practice</h1>
        <p>Curated resources and challenges to sharpen your programming skills every day</p>
      </div>
      <div class="resource-grid" id="resource-grid"></div>
    </main>
    <footer class="footer">
      <p>&copy; <span id="year"></span> Coding Daily's. Crafted for developers, by developers.</p>
    </footer>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Add a new site by adding one line here — no HTML editing needed.
      const resources = [
        ['LC', 'LeetCode', 'https://leetcode.com/problems'],
        ['GFG', 'GeeksforGeeks', 'https://www.geeksforgeeks.org/problem-of-the-day'],
        ['UV', 'OG UVA', 'https://onlinejudge.org/'],
        ['CF', 'Codeforces', 'https://codeforces.com/contests'],
        ['CS', 'CSES', 'https://cses.fi/problemset/'],
        ['PE', 'Project Euler', 'https://projecteuler.net/'],
        ['CO', 'Company Questions', 'https://github.com/liquidslr/leetcode-company-wise-problems/blob/main'],
        ['HR', 'HackerRank', 'https://www.hackerrank.com'],
        ['CW', 'CodeWars', 'https://www.codewars.com'],
        ['FCC', 'freeCodeCamp', 'https://www.freecodecamp.org'],
        ['MDN', 'MDN Web Docs', 'https://developer.mozilla.org'],
        ['KG', 'Kaggle', 'https://www.kaggle.com/competitions'],
        ['GH', 'GitHub Explore', 'https://github.com/explore'],
        ['EX', 'Exercism', 'https://exercism.org/'],
        ['FM', 'Frontend Mentor', 'https://www.frontendmentor.io/'],
        ['DC', 'DevChallenges', 'https://devchallenges.io/'],
        ['BYO', 'Build Your Own X', 'https://github.com/codecrafters-io/build-your-own-x'],
        ['DEV', 'DEV Community', 'https://dev.to/'],
        ['HN', 'Hacker News', 'https://news.ycombinator.com/'],
        ['SO', 'Stack Overflow', 'https://stackoverflow.com/'],
        ['RM', 'roadmap.sh', 'https://roadmap.sh/'],
        ['CP', 'CodePen', 'https://codepen.io/'],
        ['RP', 'Replit', 'https://replit.com/'],
        ['AOC', 'Advent of Code', 'https://adventofcode.com/'],
        ['JS', 'javascript.info', 'https://javascript.info/'],
        ['CSS', 'CSS-Tricks', 'https://css-tricks.com/'],
        ['SD', 'System Design Primer', 'https://github.com/donnemartin/system-design-primer'],
        ['TC', 'TopCoder', 'https://www.topcoder.com/'],
        ['AW', 'Awesome Lists', 'https://github.com/sindresorhus/awesome'],
        ['IH', 'Indie Hackers', 'https://www.indiehackers.com/'],
        ['TOP', 'The Odin Project', 'https://www.theodinproject.com/'],
        ['CA', 'Codecademy', 'https://www.codecademy.com/'],
        ['CI', 'Can I Use', 'https://caniuse.com/'],
        ['RX', 'Regex101', 'https://regex101.com/'],
        ['FIG', 'Figma', 'https://www.figma.com/'],
        ['PM', 'Postman', 'https://www.postman.com/'],
        ['DH', 'Docker Hub', 'https://hub.docker.com/'],
        ['RPY', 'Real Python', 'https://realpython.com/'],
        ['SM', 'Smashing Magazine', 'https://www.smashingmagazine.com/'],


      ];

      document.getElementById('resource-grid').innerHTML = resources
        .map(([tag, name, url]) =>
          `<a class="resource-chip" href="${url}" target="_blank"><span class="resource-tag">${tag}</span>${name}</a>`
        )
        .join('');

      function toggleTheme() {
        const body = document.body;
        const themeText = document.getElementById('theme-text');

        if (body.getAttribute('data-theme') === 'light') {
          body.removeAttribute('data-theme');
          themeText.textContent = 'Light Mode';
          localStorage.setItem('theme', 'dark');
        } else {
          body.setAttribute('data-theme', 'light');
          themeText.textContent = 'Dark Mode';
          localStorage.setItem('theme', 'light');
        }
      }

      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-text').textContent = 'Dark Mode';
      }
    </script>
  </body>
</html>
